# =============================================================================
# R3【预留·默认不启用】WebDAV：https://qingxuan.bbs0.cc/dav
#   启用前提：①WebDAV 服务已部署并强制认证；②只读或路径白名单；③C4 支持同域分流
#   备注：chroot 内已有 rclone，可用 `rclone serve webdav` 起步

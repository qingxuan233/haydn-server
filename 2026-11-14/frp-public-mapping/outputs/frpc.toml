# name = "tcp-ssh-fallback"
# type = "tcp"
# localIP = "127.0.0.1"
# localPort = 22
# remotePort = 0            # 占位：按面板分配的远程端口填写

# =============================================================================
# 明确不规划：80/HTTP 映射、HTTP→HTTPS 跳转、UDP 映射、
#             tailscaled SOCKS5(1055)、node-exporter 裸端口、任何 OEM 端口
# =============================================================================

# =============================================================================
# R4【预留·默认不启用】TLS 透传：仅当模型 A（服务商边缘终结）被证伪
#   启用前提：①C2 支持 type=https；②设备侧证书已就绪（ACME 或人工续期）；
#             ③已评估 DNS-01 需要阿里云 AK 的风险（不建议把 AK 放在设备上）
#   需要独立子域名 + 新增解析记录（无泛解析）；本地需有 TLS 服务监听 18443
# =============================================================================

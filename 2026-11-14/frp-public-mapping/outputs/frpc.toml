# name = "haydn-tls-passthrough"
# type = "https"
# localIP = "127.0.0.1"
# localPort = 18443
# customDomains = ["tls.qingxuan.bbs0.cc"]   # 占位：需在面板/解析管理新增记录

# =============================================================================
# R5【默认永不启用】SSH 兜底 TCP（仅 tailnet 完全不可用时临时开）
#   启用前提：①先停用密码登录、限制 AllowUsers、加失败封锁；
#             ②远程端口由面板分配（C6）；③用完立即删除隧道与本地 program
#   安全基线：SSH 正常路径是 tailnet，不是公网
# =============================================================================

#!/bin/sh
# DSH（DeepSeek Harness）Web UI 部署说明 —— 2026-11-16 落地记录
#
# 位置：chroot 内 /opt/dsh（npm 全局前缀安装 @deepseek-ai/dsh 0.2.2-rc.1）+ /opt/node24（Node v24.16.0）
# 守护：supervisor [program:haydn-dsh]，仅 loopback 127.0.0.1:3080，--no-open
# 入口：控制台网关 upstreams[{path:/ui}]（strip_prefix=true、websocket=true、auth=session）
# 访问：先登录控制台（/console/），再点入口表「DSH 控制台」→ /ui/
#
# 安装（幂等记录，供重建参考）：
#   chroot 内：export PATH=/opt/node24/bin:$PATH HOME=/root
#   /opt/node24/bin/npm install -g --prefix /opt/dsh @deepseek-ai/dsh@0.2.2-rc.1
#   校验：/opt/node24/bin/node /opt/dsh/lib/node_modules/@deepseek-ai/dsh/lib/bin.js --version  → 0.2.2-rc.1
#
# 首次启动会打印一次性 token URL（?token=... → 303 设置 cookie）；token 不写入本文件，日志在 /srv/haydn/logs/dsh.log
#
# 回滚：
#   supervisorctl -c /etc/supervisor/supervisord.conf stop haydn-dsh
#   rm /etc/supervisor/conf.d/haydn-dsh.conf && supervisorctl reread && supervisorctl update   # 移除服务
#   网关：/etc/haydn-console/gateway.json 里 upstreams{path:/ui}.enabled 置回 false 并重启 haydn-console-gateway
#   卸载程序：rm -rf /opt/dsh（/opt/node24 可能被其他组件复用，删除前先确认）
#
# 注意：控制台口令仅以 PBKDF2 哈希存于 /etc/haydn-console/secret.json，无明文；因此 /ui 只能由人工登录后访问，
#       自动化脚本无法绕过该鉴权（这是设计意图，不要为使脚本可访问而写入明文口令）。
echo "参考文档：本注释即部署记录；详细状态见 2026-11-14/web-console/README.md"

; DSH Web UI（DeepSeek Harness）—— 仅 loopback 监听，经控制台网关 /ui 反代（2026-11-16）
; 设备路径：/etc/supervisor/conf.d/haydn-dsh.conf（supervisord 在 chroot 内运行，日志用 chroot 路径）
;
; 关键参数：
;   --profile web       Web UI profile
;   --host/--port       只监听 127.0.0.1:3080（公网/局域网一律经控制台网关）
;   --no-open           服务器环境不尝试打开浏览器
;   --trusted-host      /api browser-trust 围栏只接受 loopback、绑定地址或此处声明的 authority；
;                       公网域名与局域网 Host 必须显式声明，否则 /api（含 WebSocket mux /api/remote.mux）返回 403。
;                       新增入口域名/端口时，必须同步这里与 gateway.json 的 /ui upstream。
;
; 鉴权链：浏览器 → 控制台会话（gateway auth: session）→ 网关按 authority 铸造 DSH cookie
;        （用 DSH 持久签名密钥，见 /root/.dsh/.credentials.yaml）→ DSH 校验通过。
; 回滚：stop haydn-dsh → rm 本文件 → supervisorctl reread/update → 网关 /ui.enabled 置 false 并重启网关。
[program:haydn-dsh]
command=/opt/node24/bin/node /opt/dsh/lib/node_modules/@deepseek-ai/dsh/lib/bin.js --profile web --host 127.0.0.1 --port 3080 --no-open --trusted-host qingxuan.bbs0.cc --trusted-host 192.168.31.50:18090
environment=HOME="/root",PATH="/opt/node24/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",DSH_HOME="/root/.dsh",DSH_PROFILE="web",DSH_PROFILE_DIR="/root/.dsh/profiles/web",NODE_OPTIONS="--max-old-space-size=768"
directory=/root
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/haydn/logs/dsh.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

; Haydn WebDAV（rclone serve webdav，仅监听 loopback，鉴权由网关 /dav 的 Basic 负责）
; 部署到 chroot: /etc/supervisor/conf.d/haydn-webdav.conf
; 回滚: supervisorctl stop haydn-webdav && rm /etc/supervisor/conf.d/haydn-webdav.conf && supervisorctl update
[program:haydn-webdav]
command=/opt/haydn/bin/rclone serve webdav /srv/haydn/webdav --addr 127.0.0.1:18082 --baseurl /dav --log-level INFO
directory=/srv/haydn/webdav
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/haydn/logs/webdav.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

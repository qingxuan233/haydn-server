; Haydn Vaultwarden（单二进制 + SQLite，仅监听 loopback 127.0.0.1:18084）
; 部署到 chroot: /etc/supervisor/conf.d/haydn-vaultwarden.conf
; 公网链路：frpc --> stunnel(haydn-vault-tls, 18445) --> 127.0.0.1:18084（自签证书）
; 回滚: supervisorctl stop haydn-vaultwarden
;       && rm /etc/supervisor/conf.d/haydn-vaultwarden.conf && supervisorctl update
;       （数据保留在 /srv/haydn/vaultwarden，配置在 /etc/haydn/vaultwarden.env）
[program:haydn-vaultwarden]
command=/opt/haydn/bin/vaultwarden-run.sh
directory=/srv/haydn/vaultwarden
environment=HOME="/srv/haydn/vaultwarden",USER="vaultwarden",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/haydn/logs/vaultwarden.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

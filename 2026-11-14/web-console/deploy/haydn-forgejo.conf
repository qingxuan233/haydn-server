; Haydn Forgejo（单二进制 + SQLite，仅监听 loopback，鉴权由 Forgejo 自身负责）
; 部署到 chroot: /etc/supervisor/conf.d/haydn-forgejo.conf
; 回滚: supervisorctl stop haydn-forgejo && rm /etc/supervisor/conf.d/haydn-forgejo.conf && supervisorctl update
;       （数据保留在 /srv/haydn/forgejo 与 /etc/haydn/forgejo）
[program:haydn-forgejo]
command=/opt/haydn/bin/forgejo web --config /etc/haydn/forgejo/app.ini --work-path /srv/haydn/forgejo
directory=/srv/haydn/forgejo
user=git
environment=HOME="/srv/haydn/forgejo",USER="git",GITEA_WORK_DIR="/srv/haydn/forgejo",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/haydn/logs/forgejo.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

; Haydn Web Gateway（多上游路径反向代理 + 控制台）
; 部署到 chroot: /etc/supervisor/conf.d/haydn-console.conf
; 回滚: supervisorctl stop haydn-console-gateway && rm /etc/supervisor/conf.d/haydn-console.conf && supervisorctl update
[program:haydn-console-gateway]
command=/usr/bin/python3 /opt/haydn/console/gateway.py --config /etc/haydn-console/gateway.json
directory=/opt/haydn/console
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/haydn/console-gateway.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

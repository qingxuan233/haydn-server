; Haydn Netdata（官方 aarch64 静态构建 v2.12.3，只监听 loopback，网关 /netdata 反代）
; 部署到 chroot: /etc/supervisor/conf.d/haydn-netdata.conf
; 回滚: supervisorctl stop haydn-netdata && rm /etc/supervisor/conf.d/haydn-netdata.conf && supervisorctl update
[program:haydn-netdata]
command=/opt/netdata/bin/netdata -D
directory=/opt/netdata
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/haydn/logs/netdata.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:haydn-alist]
command=/opt/alist/alist server --data /opt/alist/data
directory=/opt/alist
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/haydn/logs/alist.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

# DSH/静态资源 gzip（nginx.conf 里已有 gzip on，但 gzip_types 被注释）
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/xml text/javascript application/manifest+json image/svg+xml;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_buffers 16 8k;
gzip_http_version 1.1;

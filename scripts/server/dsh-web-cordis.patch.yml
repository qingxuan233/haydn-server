# DSH web profile patch — 服务器版（来源：desktop/cordis.patch.yml，2026-11-10 迁移）
# 已移除：web-ui-pet（服务器未安装 @linxin666/dsh-pet）、gemini-adapter（插件未安装）
# 保留：模型 provider/模型参数、默认模型、subagent、UI 设置、主题、preset、plugin-market
# 详细说明：docs/11-DSH服务器配置与模型.md
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: open-design
    model: deepseek-v4.1-flash-eco
    reasoningEffort: max

- id: ui-settings-account
  name: '@deepseek-ai/dsh-client-ui-settings-account'
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true

- id: ui-chat
  name: '@deepseek-ai/dsh-client-ui-chat'
  config:
    transcriptView: detailed
    performanceUsage: detailed

- id: ui-settings
  name: '@deepseek-ai/dsh-client-ui-settings'
  config:
    enabled: true

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      open-design:
        displayName: open-design
        apiKeyEnv: OPEN_DESIGN_API_KEY
        api: openai-responses
        baseURL: https://amr-link.open-design.ai/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 1000000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              max: max
          - id: glm-5.3-flash
            name: glm-5.3-flash
            contextWindow: 1000000
            maxTokens: 32000
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              max: max
          - id: glm-5.3-flashx
            name: glm-5.3-flashx
            contextWindow: 1000000
            maxTokens: 32000
            input:
              - text
              - image
          - id: gpt-6-luna
            name: gpt-6-luna
            contextWindow: 1000000
            maxTokens: 128000
            input:
              - text
              - image
          - id: kimi-k2.7-code
            name: kimi-k2.7-code
            contextWindow: 262144
            maxTokens: 65536
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              max: xhigh
          - id: mimo-v2.6-flash
            name: mimo-v2.6-flash
            contextWindow: 600000
            maxTokens: 32000
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              max: max
          - id: deepseek-v4.1-flash-eco
            name: deepseek-v4.1-flash-eco
            contextWindow: 1000000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max
      opencode-go:
        models:
          - id: qwen3.8-flash
            name: Qwen3.8 Flash
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
          - id: qwen3.8-max
            name: Qwen3.8 Max
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro (New)
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
          - id: kimi-k2.7-code
            name: Kimi K2.7 Code
            contextWindow: 262144
            maxTokens: 262144
            input:
              - text
              - image
          - id: kimi-k3
            name: Kimi K3
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
          - id: mimo-v2.5
            name: MiMo V2.5
            contextWindow: 1000000
            maxTokens: 128000
            input:
              - text
              - image
          - id: mimo-v2.6-flash
            name: MiMo-V2.6-Flash
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
        apiKeyEnv: OPENCODE_GO_API_KEY

- id: subagent-model-selection-settings
  name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
  config:
    enabled: true
    allowedModels:
      - provider: easy-cliproxyapi
        model: gemini-3.8-flash-high
      - provider: open-design
        model: deepseek-v4.1-flash-eco
      - provider: open-design
        model: mimo-v2.6-flash
      - provider: open-design
        model: glm-5.3-flash
      - provider: open-design
        model: kimi-k2.7-code

- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  config:
    maxDepth: 2

- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    preference: dark

- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: standard
    selectedDefault: standard

# performance: disable HMR / client HMR (not needed in production)
- id: hmr
  disabled: true

- id: client-hmr
  disabled: true


[program:dsh-guard]
command=/bin/bash /root/server/bin/dsh-guard
directory=/root
environment=HOME="/root",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/root/server/logs/dsh-guard.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
redirect_stderr=true

; DSH 稳定登录入口（从 dsh.log 取当前 token，供 nginx /app-login 反代）
[program:dsh-login]
command=/usr/bin/python3 /root/server/bin/dsh-login
directory=/root
environment=HOME="/root",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",DSH_LOG="/root/server/logs/dsh.log",DSH_LOGIN_PORT="3082"
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/root/server/logs/dsh-login.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
redirect_stderr=true
